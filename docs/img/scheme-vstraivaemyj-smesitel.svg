<rect x="40" y="150" width="160" height="250" fill="#eef0f2" stroke="#9aa0a6"/>
<rect x="200" y="150" width="20" height="250" fill="#e6d9bd" stroke="#9aa0a6"/>
<rect x="220" y="150" width="20" height="250" fill="#c9ced3" stroke="#2b2f33" stroke-width="2"/>
