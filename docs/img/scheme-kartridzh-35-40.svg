<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" role="img" aria-label="Картриджи 35 и 40 мм" font-family="system-ui, sans-serif" font-size="15" fill="#2b2f33">
<rect width="400" height="580" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="18" font-weight="600">Картридж: диаметр 35 и 40 мм</text>
<text x="200" y="54" text-anchor="middle">Вид сбоку, масштаб 35:40 соблюдён</text>
<!-- 35: ширина корпуса 105 -->
<g stroke="#2b2f33" stroke-width="2.5" fill="#fff">
<rect x="88" y="115" width="26" height="35"/>
<rect x="48" y="150" width="105" height="160" rx="6"/>
<rect x="62" y="310" width="14" height="22"/>
<rect x="125" y="310" width="14" height="22"/>
</g>
<path d="M48 105 H153 M48 99 V111 M153 99 V111" stroke="#2f6fb5" stroke-width="2.5" fill="none"/>
<text x="100" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6fb5">35 мм</text>
<text x="22" y="140">шток</text>
<path d="M66 135 H88" stroke="#555" stroke-width="1.5"/>
<text x="100" y="356" text-anchor="middle">ножки</text>
<!-- 40: ширина корпуса 120 (35:40 = 105:120) -->
<g stroke="#2b2f33" stroke-width="2.5" fill="#fff">
<rect x="272" y="115" width="26" height="35"/>
<rect x="225" y="150" width="120" height="160" rx="6"/>
<rect x="240" y="310" width="14" height="22"/>
<rect x="316" y="310" width="14" height="22"/>
</g>
<path d="M225 105 H345 M225 99 V111 M345 99 V111" stroke="#2f6fb5" stroke-width="2.5" fill="none"/>
<text x="285" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6fb5">40 мм</text>
<!-- пояснения -->
<text x="200" y="404" text-anchor="middle">Не взаимозаменяемы: в посадку</text>
<text x="200" y="424" text-anchor="middle">под 40 мм картридж 35 мм не встанет</text>
<text x="200" y="468" text-anchor="middle" font-weight="600">Перед покупкой измерьте</text>
<text x="200" y="488" text-anchor="middle" font-weight="600">старый картридж</text>
<text x="200" y="518" text-anchor="middle">диаметр, высоту, ножки, форму дна;</text>
<text x="200" y="538" text-anchor="middle">разница в 1 мм по высоте —</text>
<text x="200" y="558" text-anchor="middle">картридж не подойдёт</text>
</svg>
