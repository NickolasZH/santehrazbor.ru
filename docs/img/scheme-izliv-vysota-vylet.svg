<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" role="img" aria-label="Вид сбоку: высокий излив-гусак, вылет до центра чаши мойки, кастрюля в чаше и навесной шкаф" font-family="system-ui, sans-serif" font-size="15" fill="#2b2f33">
<rect width="400" height="530" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="18" font-weight="600">Высота и вылет излива</text>
<!-- стена и навесной шкаф -->
<rect x="8" y="44" width="16" height="272" fill="#eef0f2" stroke="#9aa0a6"/>
<rect x="24" y="44" width="356" height="40" fill="#eef0f2" stroke="#2b2f33" stroke-width="2.5"/>
<text x="150" y="70" text-anchor="middle">Навесной шкаф</text>
<!-- столешница с врезанной мойкой: чаша заметной глубины -->
<rect x="24" y="300" width="191" height="16" fill="#eef0f2" stroke="#2b2f33" stroke-width="2.5"/>
<rect x="345" y="300" width="51" height="16" fill="#eef0f2" stroke="#2b2f33" stroke-width="2.5"/>
<path d="M215 300 V390 H345 V300" fill="none" stroke="#2b2f33" stroke-width="2.5"/>
<!-- кастрюля на дне чаши, под аэратором -->
<rect x="240" y="330" width="80" height="60" rx="3" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<path d="M240 348 H230 M320 348 H330" stroke="#2b2f33" stroke-width="4" stroke-linecap="round"/>
<!-- смеситель у заднего края: основание и высокий изогнутый излив -->
<rect x="58" y="262" width="24" height="38" rx="3" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<path d="M70 262 V176 Q70 144 102 144 H248 Q280 144 280 176 V190" stroke="#2b2f33" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="268" y="190" width="24" height="16" fill="#2f6fb5"/>
<text x="300" y="201" fill="#2f6fb5" font-weight="600">аэратор</text>
<!-- струя точно в центр чаши -->
<path d="M280 210 V326" stroke="#3b7fc4" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
<!-- ось смесителя -->
<path d="M70 116 V346" stroke="#2f6fb5" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<text x="30" y="368">ось смесителя</text>
<!-- вылет: от оси до аэратора -->
<path d="M70 165 H280 M70 157 V173 M280 157 V173" stroke="#2f6fb5" stroke-width="2" fill="none"/>
<text x="175" y="188" text-anchor="middle" font-weight="600" fill="#2f6fb5">вылет</text>
<!-- высота излива: от столешницы до аэратора -->
<path d="M225 206 H268 M225 206 V300 M217 206 H233 M217 300 H233" stroke="#2f6fb5" stroke-width="2" fill="none"/>
<text x="209" y="250" text-anchor="end" font-weight="600" fill="#2f6fb5">высота</text>
<text x="209" y="270" text-anchor="end" font-weight="600" fill="#2f6fb5">излива</text>
<!-- расстояние до шкафа -->
<path d="M372 84 V300 M364 84 H380 M364 300 H380" stroke="#2b2f33" stroke-width="2" fill="none"/>
<text x="360" y="108" text-anchor="end">до шкафа —</text>
<text x="360" y="128" text-anchor="end" font-weight="600">измерьте</text>
<!-- подписи -->
<text x="200" y="435" text-anchor="middle" font-weight="600" fill="#2f6fb5">Высокий — от 250 мм:</text>
<text x="200" y="455" text-anchor="middle">помещается кастрюля</text>
<text x="200" y="488" text-anchor="middle" font-weight="600" fill="#2f6fb5">Низкий (126 мм) — под полку:</text>
<text x="200" y="508" text-anchor="middle">высокую посуду наклонять</text>
</svg>
