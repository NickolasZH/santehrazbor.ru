<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-label="Что решить до укладки плитки" font-family="system-ui, sans-serif" font-size="16" fill="#2b2f33">
<defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#eef0f2"/><path d="M0 0 V10" stroke="#b5bac0" stroke-width="2"/></pattern></defs>
<rect width="720" height="740" fill="#fff"/>
<text x="360" y="36" text-anchor="middle" font-size="18" font-weight="600">Что решить до укладки плитки</text>
<text x="360" y="60" text-anchor="middle" font-size="14">Разрез стены, вид сбоку</text>
<!-- стена -->
<rect x="80" y="90" width="220" height="170" fill="url(#h)" stroke="#555" stroke-width="2"/>
<!-- ниша и коробка -->
<rect x="200" y="115" width="100" height="120" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="7 4"/>
<rect x="215" y="135" width="85" height="80" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<!-- трубы -->
<path d="M235 215 V260" stroke="#2f6fb5" stroke-width="6"/>
<path d="M270 215 V260" stroke="#c62828" stroke-width="6"/>
<!-- плитка и панель -->
<rect x="300" y="90" width="22" height="170" fill="#dfe6ee" stroke="#555" stroke-width="2"/>
<rect x="322" y="155" width="10" height="40" fill="#2b2f33"/>
<!-- размерная глубина -->
<path d="M200 100 H300 M200 94 V106 M300 94 V106" stroke="#2b2f33" stroke-width="2" fill="none"/>
<text x="250" y="86" text-anchor="middle" font-weight="600">1. Глубина ниши</text>
<!-- выноски -->
<path d="M333 175 H356" stroke="#555" stroke-width="1.5"/>
<text x="362" y="170" font-weight="600">6. Лицевая панель</text>
<text x="362" y="190">доступ к картриджу через неё</text>
<path d="M311 235 H356" stroke="#555" stroke-width="1.5"/>
<text x="362" y="230" font-weight="600">8. Плитка с клеем</text>
<text x="362" y="250">допуск по толщине</text>
<text x="80" y="288" font-weight="600">2. Разводка труб:</text>
<text x="80" y="308">сверху или снизу</text>
<!-- чек-лист -->
<g font-size="17" transform="translate(0,350)">
<circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">1</text><text x="90" y="6">Глубина стены или ниши</text>
<g transform="translate(0,44)"><circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">2</text><text x="90" y="6">Разводка: сверху или снизу, жёсткая или гибкая</text></g>
<g transform="translate(0,88)"><circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">3</text><text x="90" y="6">Высота верхнего душа</text></g>
<g transform="translate(0,132)"><circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">4</text><text x="90" y="6">Сколько потребителей</text></g>
<g transform="translate(0,176)"><circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">5</text><text x="90" y="6">Термостат или рычаг</text></g>
<g transform="translate(0,220)"><circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">6</text><text x="90" y="6">Доступ к картриджу через лицевую панель</text></g>
<g transform="translate(0,264)"><circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">7</text><text x="90" y="6">Опрессовка до закрытия плиткой</text></g>
<g transform="translate(0,308)"><circle cx="60" cy="0" r="15" fill="#2b2f33"/><text x="60" y="6" text-anchor="middle" fill="#fff" font-weight="600">8</text><text x="90" y="6">Допуск по толщине плитки</text></g>
</g>
<text x="360" y="722" text-anchor="middle" font-size="14">Размеры — в инструкции выбранной модели</text>
</svg>
