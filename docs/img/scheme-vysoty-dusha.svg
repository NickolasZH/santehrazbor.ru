<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Высота встраиваемого гигиенического душа" font-family="system-ui, sans-serif" font-size="15" fill="#2b2f33">
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="32" text-anchor="middle" font-size="18" font-weight="600">Высота гигиенического душа</text>
<!-- пол и стена -->
<path d="M8 440 H392" stroke="#555" stroke-width="3"/>
<text x="8" y="462">Пол</text>
<rect x="300" y="60" width="90" height="380" fill="#eef0f2" stroke="#9aa0a6"/>
<!-- диапазон -->
<rect x="20" y="225" width="280" height="50" fill="#2f6fb5" opacity="0.12"/>
<path d="M20 225 H300 M20 275 H300" stroke="#2f6fb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<!-- унитаз -->
<rect x="62" y="250" width="72" height="70" rx="6" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<path d="M45 330 H150 C150 390 130 420 97 440 C64 420 45 390 45 330 Z" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<!-- человек сидя -->
<circle cx="97" cy="105" r="22" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
<path d="M97 127 V262 H165 V395" fill="none" stroke="#2b2f33" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M97 160 L170 200 L262 232" fill="none" stroke="#2b2f33" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<!-- смеситель и лейка -->
<rect x="300" y="228" width="18" height="40" rx="4" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<path d="M300 248 H272" stroke="#2b2f33" stroke-width="6" stroke-linecap="round"/>
<text x="345" y="200" text-anchor="middle" font-weight="600">Смеситель</text>
<text x="345" y="302" text-anchor="middle">и лейка</text>
<!-- размер -->
<path d="M20 440 V225 M12 440 H28 M12 225 H28 M12 275 H28" stroke="#2b2f33" stroke-width="2" fill="none"/>
<text x="200" y="492" text-anchor="middle" font-weight="600">примерно 60–80 см от пола</text>
<text x="200" y="524" text-anchor="middle">Сядьте и отметьте, куда</text>
<text x="200" y="544" text-anchor="middle">естественно тянется рука</text>
</svg>
