<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Высота встраиваемого гигиенического душа" font-family="system-ui, sans-serif" font-size="15" fill="#2b2f33">
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="32" text-anchor="middle" font-size="18" font-weight="600">Высота гигиенического душа</text>
<!-- пол и стена со смесителем -->
<path d="M8 440 H392" stroke="#555" stroke-width="3"/>
<text x="8" y="462">Пол</text>
<rect x="300" y="60" width="90" height="380" fill="#eef0f2" stroke="#9aa0a6"/>
<!-- полоса 60-80 см -->
<rect x="20" y="200" width="280" height="60" fill="#2f6fb5" opacity="0.12"/>
<path d="M20 200 H300 M20 260 H300" stroke="#2f6fb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<!-- унитаз: бачок, сиденье, основание -->
<rect x="118" y="236" width="64" height="64" rx="5" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<rect x="95" y="320" width="110" height="14" rx="6" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<path d="M122 334 H178 L186 440 H114 Z" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<!-- сидящий человек: единый контур -->
<circle cx="150" cy="160" r="22" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
<path d="M150 182 V316 M110 316 H190 M110 316 V430 M190 316 V430" fill="none" stroke="#2b2f33" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M150 205 L215 240 L275 235" fill="none" stroke="#2b2f33" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<!-- смеситель и лейка -->
<rect x="300" y="220" width="18" height="30" rx="4" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<path d="M300 235 H275" stroke="#2b2f33" stroke-width="6" stroke-linecap="round"/>
<text x="345" y="168" text-anchor="middle" font-weight="600">Смеситель</text>
<text x="345" y="188" text-anchor="middle" font-weight="600">и лейка</text>
<!-- размер -->
<path d="M20 440 V200 M12 440 H28 M12 260 H28 M12 200 H28" stroke="#2b2f33" stroke-width="2" fill="none"/>
<text x="200" y="492" text-anchor="middle" font-weight="600">примерно 60–80 см от пола</text>
<text x="200" y="524" text-anchor="middle">Сядьте и отметьте, куда</text>
<text x="200" y="544" text-anchor="middle">естественно тянется рука</text>
</svg>
