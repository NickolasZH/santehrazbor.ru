<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 716" role="img" aria-label="Устройство скрытой душевой системы" font-family="system-ui, sans-serif" font-size="15" fill="#2b2f33">
<rect width="400" height="716" fill="#fff"/>
<rect x="8" y="44" width="384" height="656" rx="8" fill="#eef0f2" stroke="#9aa0a6"/>
<text x="200" y="30" text-anchor="middle" font-size="18" font-weight="600">Скрытая система: вид на стену</text>
<!-- верхний душ -->
<text x="200" y="80" text-anchor="middle" font-weight="600">Верхний душ («тропический»)</text>
<path d="M120 300 V125 H250" fill="none" stroke="#555" stroke-width="7" stroke-linejoin="round"/>
<path d="M232 125 H340 L326 142 H246 Z" fill="#fff" stroke="#2b2f33" stroke-width="2"/>
<path d="M262 156 v14 M286 156 v14 M310 156 v14" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round"/>
<!-- встроенная часть -->
<rect x="24" y="300" width="238" height="180" rx="6" fill="#fff" stroke="#555" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="143" y="332" text-anchor="middle" font-weight="600">Встроенная часть</text>
<text x="143" y="354" text-anchor="middle">(монтажная коробка)</text>
<text x="143" y="376" text-anchor="middle">замуровывают в стену</text>
<!-- видимая панель -->
<circle cx="224" cy="428" r="24" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
<path d="M224 428 L240 418" stroke="#2b2f33" stroke-width="6" stroke-linecap="round"/>
<text x="34" y="418" font-weight="600">Видимая панель</text>
<text x="34" y="440">(рычаг,</text>
<text x="34" y="462">переключатель)</text>
<!-- подвод -->
<path d="M70 480 V530" stroke="#2f6fb5" stroke-width="7"/>
<path d="M215 480 V530" stroke="#c62828" stroke-width="7"/>
<text x="70" y="558" text-anchor="middle" font-weight="600" fill="#2f6fb5">ХВС</text>
<text x="215" y="558" text-anchor="middle" font-weight="600" fill="#c62828">ГВС</text>
<!-- шланговое подключение и лейка -->
<path d="M262 365 H350" stroke="#555" stroke-width="7"/>
<circle cx="350" cy="365" r="11" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
<text x="384" y="318" text-anchor="end" font-weight="600">Шланговое</text>
<text x="384" y="338" text-anchor="end" font-weight="600">подключение</text>
<path d="M350 376 V560" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
<rect x="328" y="560" width="44" height="14" rx="3" fill="#fff" stroke="#2b2f33" stroke-width="2"/>
<path d="M338 574 L362 574 L372 612 L328 612 Z" fill="#fff" stroke="#2b2f33" stroke-width="2"/>
<text x="384" y="648" text-anchor="end" font-weight="600">Ручная лейка</text>
<text x="384" y="668" text-anchor="end">со шлангом</text>
</svg>
